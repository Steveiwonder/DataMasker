name: Release

# Every push to master produces a new release. The version is <major.minor from the
# VersionPrefix in Directory.Build.props>.<patch>, where patch is one higher than the
# latest existing tag with that prefix. Bump VersionPrefix to start a new major or
# minor line.
#
# Add "[skip release]" to a commit message to push to master without releasing.
#
# The NuGet push is a separate job so that a NuGet problem does not block the GitHub
# release. It uses nuget.org trusted publishing: the job's OIDC token is exchanged for a
# short-lived API key by NuGet/login, so no long-lived secret is stored. The trusted
# publishing policy on nuget.org must point at this repository and this workflow file.
# If the push fails, fix the policy and re-run the failed job (gh run rerun <run id> --failed);
# the package it pushes is the one attached to the release.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # full history so existing tags are visible

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Work out next version
      id: version
      shell: bash
      run: |
        prefix=$(sed -n 's/.*<VersionPrefix>\([0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*<\/VersionPrefix>.*/\1/p' Directory.Build.props)
        if [ -z "$prefix" ]; then
          echo "VersionPrefix not found in Directory.Build.props" >&2
          exit 1
        fi

        latest=$(git tag --list "${prefix}.[0-9]*" | sort -t. -k3,3n | tail -n1)
        if [ -z "$latest" ]; then
          patch=0
        else
          patch=$(( ${latest##*.} + 1 ))
        fi

        version="${prefix}.${patch}"
        echo "Previous: ${latest:-none}  Next: ${version}"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Restore
      run: dotnet restore ./src/DataMasker.sln

    - name: Build
      run: dotnet build ./src/DataMasker.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

    - name: Test
      run: dotnet test ./src/DataMasker.Tests/DataMasker.Tests.csproj -c Release --no-build --verbosity normal

    - name: Pack library
      run: dotnet pack ./src/DataMasker/DataMasker.csproj -c Release --no-build -o ./build/ -p:Version=${{ steps.version.outputs.version }}

    - name: Publish CLI (win-x64)
      run: dotnet publish ./src/DataMasker.Runner/DataMasker.Runner.csproj -c Release -r win-x64 --self-contained -o ./runner-build/ -p:Version=${{ steps.version.outputs.version }}

    - name: Zip CLI
      run: cd ./runner-build && zip -r ../DataMasker.Runner.zip .

    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: ./build/DataMasker.${{ steps.version.outputs.version }}.nupkg

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: DataMasker.Runner.${{ steps.version.outputs.version }}
        path: ./DataMasker.Runner.zip

    - name: Create GitHub release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        commit: ${{ github.sha }}
        artifacts: "DataMasker.Runner.zip,./build/DataMasker.${{ steps.version.outputs.version }}.nupkg"
        generateReleaseNotes: true
        token: ${{ secrets.GITHUB_TOKEN }}

  nuget:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed to obtain the OIDC token for trusted publishing
      contents: read

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Download NuGet package
      uses: actions/download-artifact@v4
      with:
        name: nupkg
        path: ./build/

    - name: Log in to nuget.org (trusted publishing)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: Falcubar # nuget.org profile that owns the package and the trusted publishing policy

    - name: Push to NuGet
      run: dotnet nuget push ./build/DataMasker.${{ needs.release.outputs.version }}.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
