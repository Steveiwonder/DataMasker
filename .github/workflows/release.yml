name: Release

# Master pushes publish automatically. Add [skip release] to skip publication.
# Validation is shared with PR CI. A stable tag is reserved for the commit, so
# retries reuse the version and any existing release assets. A release remains
# a draft until NuGet trusted publishing succeeds. Do not rename this workflow
# without updating the nuget.org trusted publishing policy.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/validate.yml

  version:
    needs: validate
    if: github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      existing: ${{ steps.reserve.outputs.existing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reserve or reuse release version
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/reserve-release.py

  artifacts:
    needs: version
    if: needs.version.outputs.existing != 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x
            11.0.x
          cache: true
          cache-dependency-path: src/**/packages.lock.json
      - name: Build package and Windows runners
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet restore src/DataMasker.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/DataMasker/DataMasker.csproj -c Release --no-restore -p:Version=$env:RELEASE_VERSION -o artifacts/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($framework in @('net10.0', 'net11.0')) {
            dotnet publish src/DataMasker.Runner/DataMasker.Runner.csproj -c Release -f $framework -r win-x64 --self-contained true --no-restore -p:Version=$env:RELEASE_VERSION -o "artifacts/$framework"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $zip = "artifacts/release/DataMasker.Runner.$env:RELEASE_VERSION.$framework.win-x64.zip"
            Compress-Archive "artifacts/$framework/*" $zip
            Expand-Archive $zip "artifacts/smoke-$framework"
            & "./artifacts/smoke-$framework/DataMasker.Runner.exe" --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "./artifacts/smoke-$framework/DataMasker.Runner.exe" -c tests/fixtures/runner-smoke.json --no-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content artifacts/release/SHA256SUMS -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: artifacts/release/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  draft:
    needs: [version, artifacts]
    if: always() && needs.version.result == 'success' && (needs.artifacts.result == 'success' || needs.version.outputs.existing == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.version.outputs.existing != 'true'
        with:
          name: release-assets
          path: artifacts/
      - name: Create immutable draft release
        if: needs.version.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$RELEASE_VERSION" artifacts/* --verify-tag --draft --title "$RELEASE_VERSION" --generate-notes

      # Draft releases require push access. This job reads the immutable draft
      # assets and passes only the package to the read-only publishing job.
      - name: Retrieve the reserved package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release download "$RELEASE_VERSION" --pattern "DataMasker.$RELEASE_VERSION.nupkg" --pattern SHA256SUMS --dir package
          cd package
          grep -F "  DataMasker.$RELEASE_VERSION.nupkg" SHA256SUMS | sha256sum --check --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reserved-package
          path: package/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  nuget:
    needs: [version, draft]
    if: always() && needs.version.result == 'success' && needs.draft.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reserved-package
          path: artifacts/
      - name: Verify the reserved package
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd artifacts
          grep -F "  DataMasker.$RELEASE_VERSION.nupkg" SHA256SUMS | sha256sum --check --strict
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: Falcubar
      - name: Publish the reserved package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: dotnet nuget push "artifacts/DataMasker.$RELEASE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish:
    needs: [version, nuget]
    if: always() && needs.version.result == 'success' && needs.nuget.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "$RELEASE_VERSION" --draft=false
